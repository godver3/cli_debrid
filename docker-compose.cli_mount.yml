# cli_debrid + cli_mount in one stack (Linux, Docker Engine).
#
# Before the first start, create the two shared folders on the host and give
# the mount folder to the user cli_mount runs as (PUID below, 1000 by default):
#
#   sudo mkdir -p /mnt/cli_mount /mnt/symlinks
#   sudo chown 1000:1000 /mnt/cli_mount
#
# Then: docker compose -f docker-compose.cli_mount.yml up -d
#
# Every container sees the mount at the same path as the host: /mnt/cli_mount.
# Keep it that way, and use the same path in Plex/Jellyfin/Emby, so file paths
# and symlinks work everywhere.
# Setup guide: https://godver3.github.io/cli_docs/installation/docker/

services:
  cli_mount:
    image: ghcr.io/mash2k3/cli_mount:dev
    pull_policy: always
    container_name: cli_mount
    restart: unless-stopped
    ports:
      - "8282:8282"
    volumes:
      - ./cli_mount:/app                          # config, databases, logs and stream cache
      - /mnt/cli_mount:/mnt/cli_mount:rshared     # the mount; rshared lets the other containers see it
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=America/New_York                       # your timezone
      - PUID=1000                                 # must own /mnt/cli_mount on the host
      - PGID=1000

  cli_debrid:
    image: godver3/cli_debrid:dev
    pull_policy: always
    container_name: cli_debrid
    restart: unless-stopped
    depends_on:
      cli_mount:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./cli_debrid/db_content:/user/db_content  # databases: back this up
      - ./cli_debrid/config:/user/config
      - ./cli_debrid/logs:/user/logs
      - ./cli_mount:/climount_data                # cli_mount's data folder (database backups, log checks)
      - /mnt/cli_mount:/mnt/cli_mount:rslave      # rslave: sees the mount, and sees it again after cli_mount restarts
      - /mnt/symlinks:/mnt/symlinks               # Symlink mode only: where cli_debrid writes symlinks
    environment:
      - TZ=America/New_York                       # your timezone
      - MALLOC_ARENA_MAX=2
    tty: true
    stdin_open: true
