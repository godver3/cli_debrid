name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<78" wheel
          pip install -r requirements-linux.txt pytest pytest-timeout
      - name: Run tests
        run: python -m pytest -q --timeout=300
