name: Docker Image CI

on:
  push:
    branches: [ "dev", "main", "battery_integration"]
  workflow_dispatch:  # This enables manual triggering

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm (brings in fixed node-gyp)
        run: npm install -g npm@10.9.0
        shell: bash

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          
      - name: Set PYTHON environment variable for node-gyp
        shell: powershell
        run: |
          $pythonPath = (Get-Command python).Source
          echo "PYTHON=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Set PYTHON environment variable to $pythonPath"

      - name: Verify build environment
        shell: powershell
        run: |
          # Verify Python is available
          $pythonPath = (Get-Command python).Source
          Write-Host "Python available at: $pythonPath"
          python --version
          
          # Verify Visual Studio environment
          Write-Host "Visual Studio environment variables:"
          Write-Host "VCINSTALLDIR: $env:VCINSTALLDIR"
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          Write-Host "INCLUDE: $env:INCLUDE"
          Write-Host "LIB: $env:LIB"
          
      - name: Clean and install phalanx_db_hyperswarm dependencies
        shell: powershell
        run: |
          cd phalanx_db_hyperswarm
          
          # Force kill any processes that might be holding file handles
          Write-Host "Stopping any processes that might lock files..."
          Get-Process -Name "msbuild" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "cl" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          
          # Remove existing node_modules if it exists
          if (Test-Path "node_modules") {
            Write-Host "Removing existing node_modules directory..."
            # Use robust removal with retry logic
            $maxRetries = 3
            $retryCount = 0
            do {
              try {
                Remove-Item -Recurse -Force -Path "node_modules" -ErrorAction Stop
                Write-Host "Successfully removed node_modules"
                break
              }
              catch {
                $retryCount++
                Write-Host "Attempt $retryCount failed: $($_.Exception.Message)"
                if ($retryCount -lt $maxRetries) {
                  Write-Host "Waiting 5 seconds before retry..."
                  Start-Sleep -Seconds 5
                } else {
                  Write-Host "Max retries reached, continuing anyway..."
                }
              }
            } while ($retryCount -lt $maxRetries)
          }
          
          # Clean npm cache
          npm cache clean --force
          
          # Set environment variables for native compilation
          $env:npm_config_cache = "$env:APPDATA\npm-cache"
          $env:npm_config_progress = "false"
          
          # Try to install with prebuilt binaries first
          Write-Host "Attempting to install with prebuilt binaries..."
          npm install --prefer-offline --no-audit --no-fund --loglevel=info
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[SUCCESS] Successfully installed all dependencies with prebuilt binaries"
          } else {
            Write-Host "[ERROR] Prebuilt installation failed (exit code: $LASTEXITCODE)"
            Write-Host "[INFO] Attempting to build native modules from source..."
            
            # Clear any partial installation
            if (Test-Path "node_modules") {
              Write-Host "Clearing partial installation..."
              Remove-Item -Recurse -Force -Path "node_modules" -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
            }
            
            # Try full installation with build from source
            Write-Host "Installing all dependencies with native compilation..."
            npm install --msvs_version=2022 --loglevel=verbose
            
            if ($LASTEXITCODE -ne 0) {
              Write-Host "[FATAL ERROR] Failed to install npm dependencies"
              Write-Host "Build cannot continue without required Node.js dependencies"
              Write-Host "Exit code: $LASTEXITCODE"
              exit 1
            } else {
              Write-Host "[SUCCESS] Successfully built all dependencies from source"
            }
          }
          
          # Verify critical packages are installed
          Write-Host "`n=== Verifying Installation ==="
          $criticalPackages = @("hyperbee", "hyperswarm", "@hyperswarm/rpc", "autobase", "corestore")
          $missingPackages = @()
          
          foreach ($package in $criticalPackages) {
            $packagePath = "node_modules\$package"
            if (Test-Path $packagePath) {
              Write-Host "[OK] $package - installed"
            } else {
              Write-Host "[MISSING] $package - MISSING"
              $missingPackages += $package
            }
          }
          
          if ($missingPackages.Count -gt 0) {
            Write-Host "`n[FATAL ERROR] Missing critical packages: $($missingPackages -join ', ')"
            Write-Host "Build cannot continue without these dependencies"
            exit 1
          }
          
          Write-Host "`n[SUCCESS] All critical Node.js dependencies successfully installed"
          
          cd ..
          
      - name: Create and activate virtual environment
        shell: cmd
        run: |
          python -m venv build_venv
          call build_venv\Scripts\activate.bat
          
      - name: Install dependencies
        shell: cmd
        run: |
          call build_venv\Scripts\activate.bat
          python -m pip install --upgrade pip
          pip install "setuptools<65.0.0"  # Pin to a version that supports dash-separated keys in setup.cfg
          pip install pyinstaller
          pip install -r requirements.txt
          pip install psutil
          
      - name: Set up Go (built-in mount engine)
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build built-in mount engine
        shell: cmd
        env:
          CGO_ENABLED: "0"
        run: |
          cd engine
          go build -trimpath -ldflags="-s -w" -o clid-engine.exe ./cmd/clid-engine

      - name: Build Windows executable
        shell: cmd
        run: |
          call build_venv\Scripts\activate.bat
          pyinstaller windows_build.spec --clean

      - name: Package Windows executable
        shell: powershell
        run: |
          $version = Get-Content -Path version.txt -Raw
          $version = $version.Trim()
          
          # Create a zip file containing the entire dist directory
          Compress-Archive -Path dist\cli_debrid\* -DestinationPath "dist\cli_debrid-$version.zip"
        
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/cli_debrid-*.zip

  # Runs as soon as the Windows exe exists, alongside the Docker build.
  release:
    runs-on: ubuntu-latest
    needs: build-windows-exe
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: windows-executable

      - name: Get version and verify branch
        run: |
          VERSION=$(cat version.txt)
          BRANCH_ID=$(cat branch_id | tr -d '[:space:]')
          CURRENT_BRANCH=${{ github.ref_name }}

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Verify branch_id matches current branch
          if [ "$BRANCH_ID" != "$CURRENT_BRANCH" ]; then
            echo "::error::Branch mismatch! branch_id contains '$BRANCH_ID' but current branch is '$CURRENT_BRANCH'"
            exit 1
          fi

      # Release notes: release-notes/<version>.md, written in the PR that bumps
      # version.txt, goes on top of the release, ended by a release-notes
      # marker (the in-app Release notes popup lists releases that have it).
      # A second marker records that this branch's build posted it to Discord,
      # so a rebuild of the same version doesn't post twice. The post step adds
      # it only after Discord accepted every message, so a failed post (or a
      # version built before the webhook secret existed) is retried on the next
      # build of that version. Only dev builds post: the main build doesn't
      # post the same notes again.
      - name: Build release body
        id: notes
        run: |
          NOTES="release-notes/${VERSION}.md"
          POSTED="<!-- discord-posted:${{ github.ref_name }} -->"
          PREV=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null || true)
          ALREADY=false
          if printf '%s' "$PREV" | grep -qF "$POSTED"; then ALREADY=true; fi
          POST=false
          if [ -f "$NOTES" ] && [ -n "$WEBHOOK" ] && [ "$ALREADY" = false ] \
             && [ "${{ github.ref_name }}" != main ]; then POST=true; fi
          {
            if [ -f "$NOTES" ]; then
              cat "$NOTES"
              printf '\n\n---\n\n'
              echo "<!-- release-notes -->"
              # Keep every branch's posted marker: dev and main share this
              # release, so dropping the other branch's marker made its next
              # rebuild post the same notes again.
              printf '%s\n' "$PREV" | tr -d '\r' | grep -E '^<!-- discord-posted:[^ ]+ -->$' | sort -u || true
            fi
            echo "Version ${VERSION} (${{ github.ref_name }} branch), commit ${{ github.sha }}"
            echo ""
            echo "## Windows install"
            echo ""
            echo "1. Download the ZIP file"
            echo "2. Extract all contents to a folder of your choice"
            echo '3. Run `cli_debrid.exe` from the extracted folder'
            echo ""
            echo "**Note:** All files must be kept together in the same folder for the application to work properly."
          } > release_body.md
          echo "post=$POST" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          files: "windows-executable/cli_debrid-${{ env.VERSION }}.zip"
          name: "Release ${{ env.VERSION }}"
          tag_name: "v${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_name == 'dev' }}
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Posts the notes and the release link to the Discord release notes
      # channel (secret DISCORD_RELEASE_WEBHOOK: a webhook made in that
      # channel). Skipped without the secret or without a notes file.
      # An embed description holds 4096 characters, so long notes are split on
      # line boundaries into several messages (first one carries the title and
      # link) instead of being cut off.
      - name: Post release notes to Discord
        if: steps.notes.outputs.post == 'true'
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK not set; skipping"
            exit 0
          fi
          python3 - <<'EOF'
          import json, os, sys, time, urllib.error, urllib.request

          version = os.environ['VERSION']
          stable = os.environ['REF_NAME'] == 'main'
          title = f"Clyde {version} ({'stable' if stable else 'dev'})"
          color = 5763719 if stable else 16753920
          url = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}/releases/tag/v{version}"
          notes = open(f"release-notes/{version}.md", encoding='utf-8').read().strip()

          # Embeds don't render "### Heading" (it shows as literal #s), but bold
          # and "-" lists do: each heading becomes a bold line with a blank line
          # before it. GitHub and the in-app popup keep the real headings.
          import re
          notes = re.sub(r'\n*^#{1,6}[ \t]+(.+?)[ \t]*$\n*', r'\n\n**\1**\n', notes, flags=re.M).strip()

          # Split into sections at those headings, then pack whole sections into
          # messages so a section doesn't straddle two. A section too long for
          # one message is split on line boundaries.
          LIMIT = 3900
          sections = re.split(r'\n\n(?=\*\*[^\n]+\*\*\n)', notes)
          pieces = []
          for section in sections:
              if len(section) <= LIMIT:
                  pieces.append(section)
                  continue
              cur = ''
              for line in section.split('\n'):
                  while len(line) > LIMIT:          # a single huge line: hard split
                      if cur:
                          pieces.append(cur); cur = ''
                      pieces.append(line[:LIMIT]); line = line[LIMIT:]
                  if cur and len(cur) + 1 + len(line) > LIMIT:
                      pieces.append(cur); cur = line
                  else:
                      cur = f"{cur}\n{line}" if cur else line
              if cur:
                  pieces.append(cur)
          chunks, cur = [], ''
          for piece in pieces:
              if cur and len(cur) + 2 + len(piece) > LIMIT:
                  chunks.append(cur); cur = piece
              else:
                  cur = f"{cur}\n\n{piece}" if cur else piece
          if cur:
              chunks.append(cur)

          for i, chunk in enumerate(chunks, 1):
              embed = {'description': chunk, 'color': color}
              if i == 1:
                  embed.update(title=title, url=url)
              else:
                  embed['title'] = f"{title} ({i}/{len(chunks)})"
              # Discord refuses webhook names containing "clyde" (its old
              # built-in bot) with a 400; the title carries the name instead.
              body = json.dumps({'username': 'Release notes', 'embeds': [embed],
                                 'allowed_mentions': {'parse': []}}).encode()
              req = urllib.request.Request(os.environ['WEBHOOK'], data=body,
                                           headers={'Content-Type': 'application/json',
                                                    'User-Agent': 'clyde-release'})
              try:
                  urllib.request.urlopen(req, timeout=30).read()
              except urllib.error.HTTPError as e:
                  print(f"::error::Discord refused part {i}/{len(chunks)}: HTTP {e.code} "
                        f"{e.read().decode('utf-8', 'replace')[:500]}")
                  sys.exit(1)
              print(f"posted part {i}/{len(chunks)} ({len(chunk)} chars)")
              time.sleep(1)  # stay under the webhook rate limit
          EOF
          # Posted: record it on the release so a rebuild doesn't post again.
          POSTED="<!-- discord-posted:${REF_NAME} -->"
          sed "s|^<!-- release-notes -->\$|&\n${POSTED}|" release_body.md > release_body_posted.md
          gh release edit "v${VERSION}" --repo "$REPO" --notes-file release_body_posted.md
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The dev build creates v<version> first, as a pre-release; the main build
      # only updates it to a full release, and GitHub doesn't move the "Latest"
      # badge on an update. Set it explicitly.
      - name: Mark main release as latest
        # Also after a failed Discord post: that shouldn't keep the release
        # from being marked latest.
        if: ${{ !cancelled() && github.ref_name == 'main' && steps.release.outcome == 'success' }}
        run: gh release edit "v${{ env.VERSION }}" --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Each platform builds on a native runner (no QEMU emulation) with its own
  # layer cache, pushes by digest, and docker-merge stitches the manifest list.
  # The builds run alongside the Windows exe; only docker-merge, which applies
  # the tags, waits for it, so a failed Windows build still publishes nothing.
  docker-build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Get version and verify branch
        run: |
          VERSION=$(cat version.txt)
          BRANCH_ID=$(cat branch_id | tr -d '[:space:]')
          CURRENT_BRANCH=${{ github.ref_name }}

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Verify branch_id matches current branch
          if [ "$BRANCH_ID" != "$CURRENT_BRANCH" ]; then
            echo "::error::Branch mismatch! branch_id contains '$BRANCH_ID' but current branch is '$CURRENT_BRANCH'"
            exit 1
          fi

      - name: Notify Discord - Build Started
        if: matrix.arch == 'amd64'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_TOKEN }}
          title: "Docker Build Started"
          description: "Building version ${{ env.VERSION }} from ${{ github.ref_name }}"
          color: 0xFFA500

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=godver3/cli_debrid,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-latest
    needs: [docker-build, build-windows-exe]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Get version from version.txt
        run: echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Set Docker tags
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            TAGS="dev dev-${{ env.VERSION }} latest"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="main main-${{ env.VERSION }}"
          else
            TAGS="batteryintegration batteryintegration-${{ env.VERSION }}"
          fi
          # Same image under the original name and the Clyde name.
          echo "DOCKER_TAGS=$(for t in $TAGS; do printf 'godver3/cli_debrid:%s ' "$t"; done)" >> $GITHUB_ENV
          echo "CLYDE_TAGS=$(for t in $TAGS; do printf 'godver3/clyde:%s ' "$t"; done)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAG_ARGS=$(for t in $DOCKER_TAGS; do printf -- '-t %s ' "$t"; done)
          docker buildx imagetools create $TAG_ARGS \
            $(printf 'godver3/cli_debrid@sha256:%s ' *)

      # The Clyde name gets the same manifest. Kept separate and non-fatal so a
      # problem with the new repo never stops godver3/cli_debrid from updating.
      - name: Also publish as godver3/clyde
        id: clyde
        continue-on-error: true
        working-directory: /tmp/digests
        run: |
          TAG_ARGS=$(for t in $CLYDE_TAGS; do printf -- '-t %s ' "$t"; done)
          docker buildx imagetools create $TAG_ARGS \
            $(printf 'godver3/cli_debrid@sha256:%s ' *)

      - name: Inspect image
        run: |
          for t in $DOCKER_TAGS; do docker buildx imagetools inspect "$t"; done
          if [ "${{ steps.clyde.outcome }}" = "success" ]; then
            for t in $CLYDE_TAGS; do docker buildx imagetools inspect "$t"; done
          else
            echo "::warning::Publishing godver3/clyde failed; godver3/cli_debrid was published as usual"
          fi

      - name: Notify Discord - Build Completed
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_TOKEN }}
          title: "Docker Build Completed"
          description: "Version ${{ env.VERSION }} has been built and pushed to Docker Hub.\nTags: ${{ env.DOCKER_TAGS }}${{ steps.clyde.outcome == 'success' && env.CLYDE_TAGS || '' }}"
          color: 0x00FF00
