[pytest]
testpaths = tests
addopts = -p no:cacheprovider --strict-markers
filterwarnings =
    ignore::DeprecationWarning
# Every test is also marked with its folder (tests/<area>/), e.g. `pytest -m usenet`.
markers =
    slow: starts a fresh Python interpreter (deselect with -m "not slow")
    plex: tests/plex - Plex, Jellyfin and Bazarr
    content_sources: tests/content_sources - watchlists, Overseerr, Trakt, Discover
    usenet: tests/usenet - NZB, cli_mount, nzbdav, Zurg
    debrid: tests/debrid - debrid packs and cache checks
    scraping: tests/scraping - filtering, anime, release parsing
    matching: tests/matching - manual assign and the media matcher
    queues: tests/queues - queue and task behaviour
    metadata: tests/metadata - metadata and release dates
    core: tests/core - settings, database, logging, stats, UI
