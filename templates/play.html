{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tangerine/tangerine_play.css') }}">
<link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>{{ video.title }}</h2>
    <div class="video-container">
        <div class="custom-error"></div>
        <div class="loading-overlay">
            <div class="loading-spinner"></div>
        </div>
        <video 
            id="my-video" 
            class="video-js vjs-big-play-centered"
            controls
            preload="metadata">
        </video>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
<script>window.pageData = window.pageData || {}; window.pageData.play = Object.assign(window.pageData.play || {}, { video_id: "{{ video.id }}" });</script>
<script src="{{ url_for('static', filename='js/pages/play.js') }}"></script>
{% endblock %}
