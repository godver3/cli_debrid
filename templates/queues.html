{% extends "base.html" %}
{% block title %}Queues{% endblock %}

{% block head %}
<!-- v9 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<!-- Add Font Awesome if not already included in base.html -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/tangerine/tangerine_queues.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h1>Queues</h1>
    <!-- Processing statistics -->
    <div id="processing-stats" class="processing-stats" style="display:none; margin-bottom: 15px;">
        <strong>Items per Hour:</strong> <span id="stats-items-per-hour">N/A</span>
        &nbsp;|&nbsp;
        <strong>Estimated Remaining Scrape Time:</strong> <span id="stats-remaining-time">N/A</span>
        &nbsp;|&nbsp;
        <strong>Queue Workers:</strong>
        <select id="queue-workers-select" style="background:var(--tng-surface);color:var(--tng-text);border:1px solid var(--tng-border-2);border-radius:4px;padding:1px 4px;font-size:12px;">
            <option value="1">1 (Slow machine)</option>
            <option value="2" selected>2 (Default)</option>
            <option value="3">3 (Fast machine)</option>
        </select>
        <button id="queue-workers-save-btn" onclick="saveQueueWorkers()" style="background:var(--tng-accent);color:#fff;border:none;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;margin-left:4px;">Save</button>
        <span id="queue-workers-status" style="font-size:11px;color:var(--tng-text-3);margin-left:4px;"></span>
    </div>
    <!-- Subtle connection status notification -->
    <div id="connection-status" class="connection-status"></div>
    <div id="initialization-status" class="alert alert-info" style="display: none;">
        <i class="fas fa-sync fa-spin"></i> 
        <span id="init-step-text">Initializing system...</span>
        <div id="progress-container" class="progress mt-2" style="display: none;">
            <div id="init-progress" class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
    </div>
    <div id="queue-contents" class="queue-container" style="display: none;">
        <!-- Queue contents will be dynamically inserted here -->
    </div>
    <div id="loading-indicator" class="text-center">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <p>Loading...</p>
    </div>
</div>


<script>window.pageData = window.pageData || {}; window.pageData.queues = Object.assign(window.pageData.queues || {}, { queue_pool_workers: "{{ queue_pool_workers }}" });</script>
<script type="module" src="{{ url_for('static', filename='js/pages/queues.js') }}"></script>
{% endblock %}
