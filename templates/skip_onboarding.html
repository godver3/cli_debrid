{% extends "base.html" %}
{% block title %}Skip Onboarding{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tangerine/tangerine_onboarding.css') }}">
<div class="onboarding-container">
    <h1 class="onboarding-title">Skip Onboarding</h1>
    <p class="onboarding-text">Are you sure you want to skip the onboarding process? You can always configure settings later.</p>
    <button id="skip-onboarding-btn" class="onboarding-btn">Skip Onboarding</button>
</div>

<script>window.pageData = window.pageData || {}; window.pageData.skip_onboarding = Object.assign(window.pageData.skip_onboarding || {}, { onboarding_skip_onboarding_url: "{{ url_for("onboarding.skip_onboarding") }}", root_root_url: "{{ url_for("root.root") }}" });</script>
<script type="module" src="{{ url_for('static', filename='js/pages/skip_onboarding.js') }}"></script>
{% endblock %}
