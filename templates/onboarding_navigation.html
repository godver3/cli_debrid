<div class="onboarding-container">
    <div class="onboarding-navigation">
        {% set step_num = current_step if current_step != '3a' else 3.5 %}
        {% if step_num|float > 1 %}
            <button class="prev-step-btn onboarding-btn">Previous Step</button>
        {% endif %}
        {% if step_num|float < 6 %}
            <button class="next-step-btn onboarding-btn" {% if not (can_proceed or session.get('onboarding_step_' ~ current_step ~ '_can_proceed', False)) %}disabled{% endif %}>
                {% if current_step == 3 %}Configure Versions{% else %}Next Step{% endif %}
            </button>
        {% endif %}
        {% if step_num|float == 6 %}
            <button class="finish-setup-btn onboarding-btn">Finish Setup</button>
        {% endif %}
        <button class="skip-onboarding-btn onboarding-btn">Skip Setup</button>
    </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/tangerine/tangerine_onboarding.css') }}">

<script>window.pageData = window.pageData || {}; window.pageData.onboarding_navigation = Object.assign(window.pageData.onboarding_navigation || {}, { onboarding_skip_onboarding_url: "{{ url_for("onboarding.skip_onboarding") }}", current_step: "{{ current_step }}", onboarding_onboarding_step_url: "{{ url_for("onboarding.onboarding_step", step="3a") }}", onboarding_onboarding_step_url_2: "{{ url_for("onboarding.onboarding_step", step=3) }}", onboarding_onboarding_step_url_3: "{{ url_for("onboarding.onboarding_step", step="") }}", onboarding_onboarding_step_url_4: "{{ url_for("onboarding.onboarding_step", step=4) }}", onboarding_complete_onboarding_url: "{{ url_for("onboarding.complete_onboarding") }}", root_root_url: "{{ url_for("root.root") }}" });</script>
<script src="{{ url_for('static', filename='js/pages/onboarding_navigation.js') }}"></script>
